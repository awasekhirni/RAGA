# Continuous-integration gate for the C.A.S.E. engine (G14).
#
# Every push/PR runs, on Python 3.11 / 3.12 / 3.13:
#   1. byte-compile check        python -m compileall
#   2. lint                      ruff check (config: [tool.ruff] in pyproject.toml)
#   3. static types              mypy case_engine (config: [tool.mypy])
#   4. unit + integration tests  pytest tests/
#   5. doctests                  pytest --doctest-modules case_engine/
#   6. offline examples          examples/*.py (mock provider, no network)
#
# The suite is fully hermetic (mock LLM, tmp-dir ledgers), so no secrets
# and no network access are required on CI runners.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install engine + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[crypto,server,dev]"

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q case_engine/ tests/ examples/

      - name: Lint (ruff)
        run: ruff check case_engine/ tests/ examples/

      - name: Static types (mypy)
        run: mypy case_engine/

      - name: Tests (pytest)
        run: python -m pytest tests/ -p no:cacheprovider

      - name: Doctests
        run: python -m pytest --doctest-modules case_engine/ -p no:cacheprovider

      - name: Offline examples (mock provider)
        run: |
          for ex in examples/*.py; do
            echo "::group::python $ex"
            python "$ex"
            echo "::endgroup::"
          done

      - name: CLI smoke (offline)
        run: |
          python -m case_engine demo --ledger-path "$RUNNER_TEMP/demo.jsonl" --quiet
          python -m case_engine run "CI smoke query" --ledger memory --quiet
